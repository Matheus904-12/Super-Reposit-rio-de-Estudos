<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redações - RedaENEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dark-mode.css" id="dark-mode">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="redacoes-page">
    <div class="sidebar">
        <!-- Mesmo sidebar do dashboard -->
    </div>
    
    <div class="main-content">
        <header class="main-header">
            <div class="header-left">
                <button class="btn-menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Redações</h1>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <input type="text" placeholder="Buscar redação...">
                    <i class="fas fa-search"></i>
                </div>
                <button class="btn-upload" id="upload-redacao">
                    <i class="fas fa-cloud-upload-alt"></i> Enviar Redações
                </button>
            </div>
        </header>
        
        <div class="redacoes-content">
            <div class="filters">
                <div class="filter-group">
                    <label for="filter-status">Status:</label>
                    <select id="filter-status">
                        <option value="all">Todas</option>
                        <option value="analyzed">Analisadas</option>
                        <option value="pending">Pendentes</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="filter-date">Data:</label>
                    <select id="filter-date">
                        <option value="all">Todas</option>
                        <option value="today">Hoje</option>
                        <option value="week">Esta semana</option>
                        <option value="month">Este mês</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="filter-score">Nota:</label>
                    <select id="filter-score">
                        <option value="all">Todas</option>
                        <option value="0-300">0-300</option>
                        <option value="300-600">300-600</option>
                        <option value="600-900">600-900</option>
                        <option value="900-1000">900-1000</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="filter-ia">IA Detectada:</label>
                    <select id="filter-ia">
                        <option value="all">Todas</option>
                        <option value="yes">Sim</option>
                        <option value="no">Não</option>
                    </select>
                </div>
            </div>
            
            <div class="redacoes-list">
                <div class="list-header">
                    <div class="header-item">Aluno</div>
                    <div class="header-item">Tema</div>
                    <div class="header-item">Data</div>
                    <div class="header-item">Status</div>
                    <div class="header-item">Nota</div>
                    <div class="header-item">IA</div>
                    <div class="header-item">Ações</div>
                </div>
                
                <div class="list-body" id="redacoes-list-body">
                    <!-- Preenchido via JavaScript -->
                </div>
                
                <div class="list-pagination">
                    <button class="btn-pagination" id="prev-page">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span id="current-page">1</span>
                    <span>de</span>
                    <span id="total-pages">1</span>
                    <button class="btn-pagination" id="next-page">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Upload -->
    <div class="modal" id="upload-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Enviar Redações</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="upload-area" id="drop-area">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Arraste e solte arquivos aqui ou</p>
                    <button class="btn-select-files">Selecionar Arquivos</button>
                    <input type="file" id="file-input" multiple style="display: none;">
                    <p class="upload-info">Formatos suportados: .txt, .docx, .pdf</p>
                </div>
                
                <div class="upload-options">
                    <div class="option-group">
                        <label for="upload-tema">Tema da Redação:</label>
                        <input type="text" id="upload-tema" placeholder="Ex: Desafios da educação digital no Brasil">
                    </div>
                    
                    <div class="option-group">
                        <label for="upload-texto-motivador">Texto Motivador (opcional):</label>
                        <textarea id="upload-texto-motivador" rows="3" placeholder="Cole aqui o texto motivador da proposta de redação"></textarea>
                    </div>
                    
                    <div class="option-group">
                        <label>
                            <input type="checkbox" id="upload-analise-automatica"> 
                            Realizar análise automática ao enviar
                        </label>
                    </div>
                </div>
                
                <div class="upload-progress" id="upload-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">0%</div>
                </div>
                
                <div class="upload-files-list" id="upload-files-list">
                    <!-- Lista de arquivos sendo exibida aqui -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel">Cancelar</button>
                <button class="btn-upload-start" disabled>Iniciar Upload</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/redacoes.js"></script>
    <script src="js/gsap-animations.js"></script>
    <script src="js/includes.js"></script>
</body>
</html>
