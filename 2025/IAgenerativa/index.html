<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedaENEM - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="logo-container">
            <img src="assets/images/logo-enem.png" alt="RedaENEM" class="logo">
            <h1>RedaENEM</h1>
            <p>Plataforma profissional de análise de redações</p>
        </div>
        
        <div class="login-form">
            <h2>Entrar como Professor</h2>
            <button id="googleLogin" class="btn-google">
                <i class="fab fa-google"></i> Continuar com Google
            </button>
            
            <div class="divider">
                <span>ou</span>
            </div>
            
            <form id="emailLogin">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            
            <p class="register-link">Não tem uma conta? <a href="#" id="register">Registre-se</a></p>
        </div>
    </div>
    
    <div class="login-footer">
        <p>© 2023 RedaENEM - Plataforma de Análise de Redações do ENEM</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/auth.js"></script>
    <script src="js/gsap-animations.js"></script>
</body>
</html>
