# fly.toml app configuration file generated for suburban on 2026-07-22T22:28:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'suburban'
primary_region = 'gru'

[build]

[env]
  ALLOWED_HOSTS = '.fly.dev,localhost,127.0.0.1'
  DEBUG = 'False'

[[mounts]]
  source = 'cptm_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
